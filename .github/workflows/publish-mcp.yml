name: Build release assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build release assets
        working-directory: plugins/openproject
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run build
          cp dist/openproject-mcp.js ../../openproject-mcp.js
          cp README.md ../../README.md
          cd ../..
          tar -czf openproject-mcp-${{ github.event.release.tag_name }}.tar.gz openproject-mcp.js README.md
          sha256sum openproject-mcp-${{ github.event.release.tag_name }}.tar.gz > SHA256SUMS

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" openproject-mcp-${{ github.event.release.tag_name }}.tar.gz SHA256SUMS
